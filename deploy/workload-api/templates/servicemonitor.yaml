apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-api-monitor
  labels:
    app.kubernetes.io/name: workload-api
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-api
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
